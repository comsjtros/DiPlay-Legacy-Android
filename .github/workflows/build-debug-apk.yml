name: Build source-only debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android build packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;25.2.9519653"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run checks and build debug APKs
        run: >-
          bash gradlew --no-daemon --no-configuration-cache
          :shared:testDebugUnitTest
          :common:testDebugUnitTest
          :home:testDebugUnitTest
          :mobile:lintDebug
          :home:lintDebug
          :maphost:lintDebug
          :mobile:assembleDebug
          :home:assembleDebug
          :maphost:assembleDebug

      - name: Upload DiPlay mobile debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-mobile-debug-${{ github.sha }}
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
          retention-days: 14
