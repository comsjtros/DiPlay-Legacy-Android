name: Build source-only debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify Android build packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "Neither ANDROID_HOME nor ANDROID_SDK_ROOT is configured on this runner." >&2
            exit 1
          fi
          echo "Using Android SDK at $sdk_root"
          for package in \
            "$sdk_root/platforms/android-37" \
            "$sdk_root/build-tools/36.0.0" \
            "$sdk_root/ndk/25.2.9519653"; do
            if [[ ! -d "$package" ]]; then
              echo "Required preinstalled Android SDK package is missing: $package" >&2
              exit 1
            fi
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run checks and build debug APKs
        run: >-
          bash gradlew --no-daemon --no-configuration-cache
          :shared:testDebugUnitTest
          :common:testDebugUnitTest
          :home:testDebugUnitTest
          :mobile:lintDebug
          :home:lintDebug
          :maphost:lintDebug
          :mobile:assembleDebug
          :home:assembleDebug
          :maphost:assembleDebug

      - name: Upload DiPlay mobile debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-mobile-debug-${{ github.sha }}
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
          retention-days: 14
